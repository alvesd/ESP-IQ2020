# ESPHome configuration for running the IQ2020 hot tub controller WITHOUT Home Assistant,
# managed directly by the IQ2020 mobile app (see ../app).
#
# Differences from the upstream sample config in README.md:
#  - api.reboot_timeout is disabled. By default ESPHome reboots the ESP32 every 15 minutes
#    when no API client is connected, which is the normal state when only a phone app is used.
#  - mDNS is explicit so the app can discover the device as _esphomelib._tcp.
#  - Time comes from SNTP instead of Home Assistant.
#  - Fallback hotspot + captive portal + Improv let a fresh device join Wi-Fi without a laptop.
#  - The app builds its screen from whatever entities the device reports, grouped by type
#    (climate, fans = jets, switches, selects, numbers, sensors). ESPHome derives each
#    entity's object_id from its *name* ("Jets 1" -> jets_1); the app only uses object ids to
#    pick a few headline sensors (current_temperature, heater_power, ...), so keep those names.
#
# Generate an API key with:  openssl rand -base64 32
# The same key is entered (or scanned) in the app.

substitutions:
  device_name: hot-tub
  friendly_name: Hot Tub

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "IQ2020 spa (mobile app)"
  project:
    name: "iq2020.mobile"
    version: "0.1.0"

esp32:
  board: m5stack-atom
  framework:
    type: arduino

logger:
  baud_rate: 0
  level: ERROR

api:
  encryption:
    key: !secret api_encryption_key
  # No Home Assistant: never reboot because no client is connected.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

captive_portal:

mdns:
  disabled: false

# Wi-Fi provisioning over USB serial (ESPHome web flasher / Improv).
improv_serial:

# Optional: Wi-Fi provisioning over Bluetooth from the app. Costs ~150 KB of flash and RAM;
# uncomment once the app's BLE onboarding is implemented.
# esp32_improv:
#   authorizer: none

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Los_Angeles

external_components:
  # Point this at your fork once you change the component itself, e.g.
  #   - source: github://<your-github-user>/esp-iq2020@mobile-app
  - source: github://ylianst/esp-iq2020

uart:
  id: SpaConnection
  tx_pin: GPIO26
  rx_pin: GPIO32
  baud_rate: 38400

iq2020:
  uart_id: SpaConnection
  polling_rate: 65
  # Do NOT enable "port:" in production: it is an unauthenticated raw RS485 bridge.

# If the spa remote shows Celsius, replace _f_ with _c_ below and set celsius: true in climate.
sensor:
  - platform: iq2020
    current_f_temperature:
      name: Current Temperature
      id: current_temperature
    target_f_temperature:
      name: Target Temperature
      id: target_temperature
    outlet_f_temperature:
      name: Heater Outlet
      id: heater_outlet
    power_l1:
      name: Pumps Power
      id: pumps_power
    power_heater:
      name: Power Heater
      id: power_heater
    power_l2:
      name: Heater Power
      id: heater_power
    pcb_f_temperature:
      name: Controller Temperature
      id: controller_temperature
  - platform: wifi_signal
    name: WiFi Signal
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: iq2020
    connected:
      name: Spa Connected
      id: spa_connected

switch:
  - platform: iq2020
    name: Lights
    id: lights
    icon: "mdi:lightbulb"
    datapoint: 0
  - platform: iq2020
    name: Spa Lock
    id: spa_lock
    icon: "mdi:lock"
    datapoint: 1
  - platform: iq2020
    name: Temperature Lock
    id: temperature_lock
    icon: "mdi:lock"
    datapoint: 2
  - platform: iq2020
    name: Clean Cycle
    id: clean_cycle
    icon: "mdi:vacuum"
    datapoint: 3
  - platform: iq2020
    name: Summer Timer
    id: summer_timer
    icon: "mdi:sun-clock"
    datapoint: 4

fan:
  - platform: iq2020
    name: Jets 1
    id: jets_1
    icon: "mdi:turbine"
    datapoint: 0
    speeds: 1
  - platform: iq2020
    name: Jets 2
    id: jets_2
    icon: "mdi:turbine"
    datapoint: 1
    speeds: 2

climate:
  - platform: iq2020
    name: Temperature
    id: temperature
    celsius: false

text_sensor:
  - platform: iq2020
    versionstr:
      name: Version
      id: spa_version

button:
  - platform: restart
    name: Restart Controller
    id: restart_controller
    entity_category: config
